server:
  port: 9000

spring:
  application:
    name: mall-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: product-service
          uri: lb://mall-product-service
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1
        - id: cart-service
          uri: lb://mall-cart-service
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: lb://mall-order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: lb://mall-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

knife4j:
  enable: true
  setting:
    enableSwaggerModels: true
    enableDocumentManage: true

logging:
  level:
    org.springframework.cloud.gateway: debug